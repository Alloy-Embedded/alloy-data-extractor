# Pinned upstream revisions for each extractor.
#
# Bumping a pin is a reviewable PR.  CI re-runs every extractor
# against the new pin and opens a PR against alloy-devices-yml
# when YAML output drifts.
#
# Identity convention: ``[<vendor-or-source-id>]`` table per
# upstream, with at minimum a ``revision`` field (git SHA, pack
# version, etc.) and an ``origin_url`` for traceability.

[cmsis-svd-data]
origin_url = "https://github.com/cmsis-svd/cmsis-svd-data"
revision = "main"  # bump to specific SHA when first wave lands
license = "Per-vendor (mostly BSD-3 or permissive)"

[stm32-open-pin-data]
origin_url = "https://github.com/STMicroelectronics/STM32_open_pin_data"
revision = "main"
license = "BSD-3-Clause"

[stm32cubemx-db]
origin_url = "https://www.st.com/en/development-tools/stm32cubemx.html"
revision = "v6.17"
license = "ST proprietary (redistribution not allowed)"
notes = "STM32CubeMX MCU database (db/mcu/*.xml + db/mcu/IP/* + db/plugins/clock/*). User installs CubeMX locally and supplies the install path via --source stm32cubemx-db=<path>; we never bundle the binary."

[ti-msp430-headers]
origin_url = "https://www.ti.com/tool/MSP430-GCC-OPENSOURCE"
revision = "msp430-gcc-9.3.1.11"
license = "BSD-3-Clause / TI redistributable"
notes = "TI MSP430 device-header bundle (msp430xxxx.h chain) shipped with msp430-gcc / Code Composer Studio. Supplies SFR address + sfrb/sfrw width declarations the Phase 3.3 extractor consumes via --source msp430=<header>."

[microchip-mplab-x-dfp]
origin_url = "https://packs.download.microchip.com"
revision = "TBD"  # per-pack version pinned when ATDF extractor migrates
license = "Microchip permissive (redistribution allowed)"
notes = "AVR + SAM + PIC8/16/18/24/32 + dsPIC33 — covers ~2000 chips no other OSS HAL framework reaches."

[zephyr]
origin_url = "https://github.com/zephyrproject-rtos/zephyr"
revision = "main"
license = "Apache-2.0"

[espressif-esp-idf]
origin_url = "https://github.com/espressif/esp-idf"
revision = "v5.3"
license = "Apache-2.0"

[nxp-mcuxpresso-sdk]
origin_url = "https://github.com/nxp-mcuxpresso/mcux-sdk"
revision = "main"
license = "BSD-3-Clause"

[modm-devices]
origin_url = "https://github.com/modm-io/modm-devices"
revision = "develop"
license = "BSD-3-Clause / MPL-2.0"

[raspberrypi-pico-sdk]
origin_url = "https://github.com/raspberrypi/pico-sdk"
revision = "master"
license = "BSD-3-Clause"

# ---------------------------------------------------------------------------
# Community RISC-V vendors — `add-riscv-community-svd-extractor`
# (Phase 3.4) admits these via the existing CMSIS-SVD extractor.
# Each pins one upstream SVD repository per vendor.
# ---------------------------------------------------------------------------

[gigadevice-svd]
origin_url = "https://github.com/riscv-rust/gd32vf103-pac"
revision = "master"
license = "MIT OR Apache-2.0"
notes = "GD32V series (GD32VF103 etc) — ~10 chips."

[bouffalo-svd]
origin_url = "https://github.com/bouffalolab/bl_iot_sdk"
revision = "master"
license = "Apache-2.0"
notes = "BL602 / BL702 / BL808 / BL616 — RISC-V (~5 chips)."

[wch-svd]
origin_url = "https://github.com/openwch/ch32v003"
revision = "main"
license = "Apache-2.0"
notes = "CH32V series (RV32EC / IMC / IMAFC) — ~30 chips."

[kendryte-svd]
origin_url = "https://github.com/kendryte/kendryte-standalone-sdk"
revision = "develop"
license = "Apache-2.0"
notes = "K210 / K230 — RV64GC dual-core."

[allwinner-svd]
origin_url = "https://github.com/smaeul/sun20i_d1_splboot"
revision = "master"
license = "GPL-2.0-or-later"
notes = "Allwinner D1 / D1s — single-core RV64GC."
