# ESP32-C6 family overlay — RV32IMAC single-core HP + RV32IMAC LP
# coprocessor.  First Espressif chip with Wi-Fi 6 + Thread/Zigbee.
#
# Sourced from ESP32-C6 TRM rev 1.1, Datasheet v0.9.

description = "Espressif ESP32-C6 RISC-V Wi-Fi 6 + BLE 5.3 + 802.15.4 (Thread/Zigbee)"
package     = "qfn40"

[adc]
max_clock_hz = 5_000_000
[uart]
max_baud_hz = 5_000_000
[spi]
max_clock_hz = 80_000_000
[i2c]
max_clock_hz = 800_000

[[i2c.speed_options]]
name = "standard"
speed_hz = 100_000
[[i2c.speed_options]]
name = "fast"
speed_hz = 400_000
[[i2c.speed_options]]
name = "fast_plus_800k"
speed_hz = 800_000

[[memories]]
name = "ROM"
base_address = 0x40000000
size_bytes = 327680           # 320 KB ROM
access = "rx"
role = "boot-rom"

[[memories]]
name = "HP_SRAM"
base_address = 0x40800000
size_bytes = 524288           # 512 KB high-perf SRAM (HPCPU view)
access = "rwx"

[[memories]]
name = "LP_SRAM"
base_address = 0x50000000
size_bytes = 16384            # 16 KB low-power SRAM (LP coprocessor)
access = "rwx"
role = "rtc-slow"

[[memories]]
name = "DROM"
base_address = 0x42000000
size_bytes = 16777216         # 16 MB external Flash mapped read
access = "ro"
role = "xip-flash-data"

[[memories]]
name = "IROM"
base_address = 0x42000000
size_bytes = 16777216
access = "rx"
role = "xip-flash-exec"

[system_clock.oscillators.xtal]
freq_hz = 40_000_000
kind = "crystal-external"
[system_clock.oscillators.rc_fast]
freq_hz = 17_500_000
kind = "rc-internal"
[system_clock.oscillators.rc_slow]
freq_hz = 150_000
kind = "rc-internal"
[system_clock.oscillators.xtal32k]
freq_hz = 32_768
kind = "crystal-external"
optional = true
[system_clock.oscillators.pll_cpu]
freq_hz = 480_000_000
kind = "synthesised"

[[system_clock.domains]]
id = "sysclk"
sources = ["xtal", "rc_fast", "pll_cpu"]
[[system_clock.domains]]
id = "rtc_slow_clk"
sources = ["rc_slow", "xtal32k"]

[system_clock.post_reset_profile]
name = "post-reset-rc-fast-17mhz"
sysclk_hz = 17_500_000
hclk_hz = 17_500_000
pclk_hz = 17_500_000
source = "rc_fast"

[[system_clock.recommended_profiles]]
name = "xtal-40mhz"
sysclk_hz = 40_000_000
hclk_hz = 40_000_000
pclk_hz = 40_000_000
source = "xtal"

[[system_clock.recommended_profiles]]
name = "pll-cpu-80mhz"
sysclk_hz = 80_000_000
hclk_hz = 80_000_000
pclk_hz = 80_000_000
source = "pll_cpu"

[[system_clock.recommended_profiles]]
name = "pll-cpu-160mhz-max"
sysclk_hz = 160_000_000
hclk_hz = 160_000_000
pclk_hz = 80_000_000
source = "pll_cpu"

[wireless.wifi]
standards = ["b", "g", "n", "ax"]    # Wi-Fi 6 (HE)
band_ghz = [2.4]

[wireless.bluetooth]
version = "5.3"
profiles = ["le"]

[wireless.thread]
version = "1.3"

[wireless.zigbee]
version = "3.0"

[wireless]
ieee_802_15_4 = true

[[power_domains]]
id = "active"
[[power_domains]]
id = "modem-sleep"
[[power_domains]]
id = "light-sleep"
[[power_domains]]
id = "deep-sleep"
peripherals = ["rtc_gpio", "rtc_cntl", "lp_core"]

strapping_pins = ["GPIO8", "GPIO9", "GPIO15"]
