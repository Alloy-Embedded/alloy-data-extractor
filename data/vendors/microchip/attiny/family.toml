# ATTINY family overlay — auto-scaffolded by
# scripts/scaffold_family_overlay.py from ATtiny204.atdf.
#
# Core (per ATDF <device architecture>): Avr8X
# CHIP_FREQ_CPU_MAX:                     48_000_000 Hz
#
# Refine peripheral max clocks from the family datasheet
# when you need silicon-accurate ceilings — these are
# conservative defaults derived from CPU_MAX.

# ---------------------------------------------------------------------------
# ADC / UART / SPI / I²C max clocks
# ---------------------------------------------------------------------------

[adc]
max_clock_hz = 16_000_000  # 16 MHz

[uart]
max_baud_hz = 6_000_000  # 6 MHz

[spi]
max_clock_hz = 24_000_000  # 24 MHz

[i2c]
max_clock_hz = 1_000_000  # 1 MHz (Fast-Mode-Plus, supported by every modern Atmel SERCOM/TWIHS)

[[i2c.speed_options]]
name = "standard"
speed_hz = 100_000

[[i2c.speed_options]]
name = "fast"
speed_hz = 400_000

[[i2c.speed_options]]
name = "fast_plus"
speed_hz = 1_000_000

# ---------------------------------------------------------------------------
# Memory regions (auto-populated from ATDF <address-space><memory-segment>)
# ---------------------------------------------------------------------------

[[memories]]
name = "IO"
kind = "io"
base_address = 0x00000000
size_bytes = 4352
access = "rw"

[[memories]]
name = "SIGNATURES"
kind = "external"
base_address = 0x00001100
size_bytes = 3
access = "ro"

[[memories]]
name = "PROD_SIGNATURES"
kind = "external"
base_address = 0x00001103
size_bytes = 61
access = "ro"

[[memories]]
name = "FUSES"
kind = "external"
base_address = 0x00001280
size_bytes = 10
access = "rw"

[[memories]]
name = "LOCKBITS"
kind = "external"
base_address = 0x0000128A
size_bytes = 1
access = "rw"

[[memories]]
name = "USER_SIGNATURES"
kind = "external"
base_address = 0x00001300
size_bytes = 32
access = "rw"

[[memories]]
name = "EEPROM"
kind = "eeprom"
base_address = 0x00001400
size_bytes = 64
access = "rw"

[[memories]]
name = "INTERNAL_SRAM"
kind = "sram"
base_address = 0x00003F80
size_bytes = 128
access = "rw"

[[memories]]
name = "MAPPED_PROGMEM"
kind = "external"
base_address = 0x00008000
size_bytes = 2048  # 2 KB
access = "rw"

[[memories]]
name = "PROGMEM"
kind = "flash"
base_address = 0x00000000
size_bytes = 2048  # 2 KB
access = "rwx"
address_space = "code"

# ---------------------------------------------------------------------------
# System clock — minimal post-reset + max profile.
# Refine with PLL params + named oscillators per family datasheet.
# ---------------------------------------------------------------------------

[system_clock.post_reset_profile]
name = "factory-default"
sysclk_hz = 1_000_000  # 1 MHz
hclk_hz = 1_000_000  # 1 MHz
pclk_hz = 1_000_000  # 1 MHz
source = "internal-rc"

[[system_clock.recommended_profiles]]
name = "avr8x-max"
sysclk_hz = 48_000_000  # 48 MHz
hclk_hz = 48_000_000  # 48 MHz
pclk_hz = 48_000_000  # 48 MHz
source = "pll"
