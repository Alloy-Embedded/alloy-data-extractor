# ---------------------------------------------------------------------------
# System clock — minimal post-reset + max profile.
# Refine with PLL params + named oscillators per family datasheet.
# ---------------------------------------------------------------------------

[system_clock.post_reset_profile]
name = "factory-default"
sysclk_hz = 1_000_000  # 1 MHz
hclk_hz = 1_000_000  # 1 MHz
pclk_hz = 1_000_000  # 1 MHz
source = "internal-rc"

[[system_clock.recommended_profiles]]
name = "cortexm23-max"
sysclk_hz = 48_000_000  # 48 MHz
hclk_hz = 48_000_000  # 48 MHz
pclk_hz = 48_000_000  # 48 MHz
source = "pll"
