# PIC32CM-JH family overlay — auto-scaffolded by
# scripts/scaffold_family_overlay.py from PIC32CM5164JH00032.atdf.
#
# Core (per ATDF <device architecture>): Cortex-M0+
# CHIP_FREQ_CPU_MAX:                     48_000_000 Hz
#
# Refine peripheral max clocks from the family datasheet
# when you need silicon-accurate ceilings — these are
# conservative defaults derived from CPU_MAX.

# ---------------------------------------------------------------------------
# ADC / UART / SPI / I²C max clocks
# ---------------------------------------------------------------------------

[adc]
max_clock_hz = 16_000_000  # 16 MHz

[uart]
max_baud_hz = 6_000_000  # 6 MHz

[spi]
max_clock_hz = 24_000_000  # 24 MHz

[i2c]
max_clock_hz = 1_000_000  # 1 MHz (Fast-Mode-Plus, supported by every modern Atmel SERCOM/TWIHS)

[[i2c.speed_options]]
name = "standard"
speed_hz = 100_000

[[i2c.speed_options]]
name = "fast"
speed_hz = 400_000

[[i2c.speed_options]]
name = "fast_plus"
speed_hz = 1_000_000

