# STM32F3 family overlay — Cortex-M4F mixed-signal line.
#
# Sourced from:
#   * RM0316 (STM32F303xB/C/D/E + STM32F358xC) rev. 8
#   * DS9118 (STM32F303xB/C) rev. 17
#   * Cmsis device header stm32f3xx.h
#
# F3 introduced the modern STM32 ADC IP with 12-bit max + DMA +
# 8.2 Msps single-channel.  Calibration model = two-point (cf. F1).

# ---------------------------------------------------------------------------
# ADC
# ---------------------------------------------------------------------------

[adc]
# RM0316 §15.3.1 — F3 ADC max clock = 72 MHz (matches sysclk).
max_clock_hz = 72_000_000

[adc.calibration_context]
# RM0316 §15.3.30 — TS_CAL1 = 30 °C, TS_CAL2 = 110 °C @ V_REF = 3.3 V.
peripheral = "ADC1"
vrefint_nominal_mv = 1230
cal_voltage_mv = 3300
cal_temp_low_celsius = 30
cal_temp_high_celsius = 110

[[adc.calibration_data_points]]
peripheral = "ADC1"
kind = "vrefint_cal"
address = 0x1FFFF7BA
size_bits = 16
semantic_constant = 3300

[[adc.calibration_data_points]]
peripheral = "ADC1"
kind = "ts_cal_low"
address = 0x1FFFF7B8
size_bits = 16
semantic_constant = 30

[[adc.calibration_data_points]]
peripheral = "ADC1"
kind = "ts_cal_high"
address = 0x1FFFF7C2
size_bits = 16
semantic_constant = 110

# RM0316 §15.3.21 — F3 ADC1 internal channels.
[[adc.internal_channels]]
peripheral = "ADC1"
kind = "temperature_sensor"
channel_index = 16

[[adc.internal_channels]]
peripheral = "ADC1"
kind = "vbat"
channel_index = 17

[[adc.internal_channels]]
peripheral = "ADC1"
kind = "vrefint"
channel_index = 18

# ---------------------------------------------------------------------------
# UART / I²C
# ---------------------------------------------------------------------------

[uart]
# RM0316 §29.4.7 — USART baud max at PCLK = 72 MHz oversample-8.
max_baud_hz = 9_000_000

[i2c]
# RM0316 §28.4 — F3 I²C supports Fast-Mode-Plus (1 MHz).
max_clock_hz = 1_000_000

[[i2c.speed_options]]
name = "standard"
speed_hz = 100_000

[[i2c.speed_options]]
name = "fast"
speed_hz = 400_000

[[i2c.speed_options]]
name = "fast_plus"
speed_hz = 1_000_000

# ---------------------------------------------------------------------------
# Memory regions
# ---------------------------------------------------------------------------

[[memories]]
name = "FLASH"
kind = "flash"
base_address = 0x0800_0000
size_bytes = 524288   # 512 KB max on STM32F303xE — overridable
access = "rx"
address_space = "code"

[[memories]]
name = "SRAM"
kind = "sram"
base_address = 0x2000_0000
size_bytes = 65536    # 64 KB max
access = "rwx"
address_space = "data"

# CCMRAM — Core Coupled Memory, fast access from CPU.
[[memories]]
name = "CCMRAM"
kind = "sram"
base_address = 0x1000_0000
size_bytes = 16384    # 16 KB on STM32F303xE
access = "rwx"
role = "ccm"

# ---------------------------------------------------------------------------
# System clock
# ---------------------------------------------------------------------------
# RM0316 §8.4.4 — F3 boots from HSI8 (8 MHz), max sysclk 72 MHz
# via PLL fed from HSI/2 or HSE.

[system_clock.post_reset_profile]
name = "default-hsi8-8mhz"
sysclk_hz = 8_000_000
hclk_hz = 8_000_000
pclk_hz = 8_000_000
source = "HSI8"

[[system_clock.recommended_profiles]]
name = "pll-hsi-64mhz"
sysclk_hz = 64_000_000
hclk_hz = 64_000_000
pclk_hz = 32_000_000   # PCLK1 must be ≤ 36 MHz
source = "PLL_HSI"
pll_input = "HSI/2"
pll_mul = 16

[[system_clock.recommended_profiles]]
name = "pll-hse-72mhz"
sysclk_hz = 72_000_000
hclk_hz = 72_000_000
pclk_hz = 36_000_000
source = "PLL_HSE"
pll_input = "HSE"
pll_mul = 9    # 8 MHz × 9 = 72 MHz
