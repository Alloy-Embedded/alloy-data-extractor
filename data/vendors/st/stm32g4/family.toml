# STM32G4 family overlay — Cortex-M4F + DSP + math accelerator
# (CORDIC + FMAC) for motor control / digital power.
#
# Sourced from:
#   * RM0440 (STM32G4 Series) rev. 8
#   * DS12288 (STM32G473xx/483xx) rev. 5
#   * Cmsis device header stm32g4xx.h
#
# G4 ADC calibration ROM lives at the modern G0 / U0 / WL range
# (0x1FFF75A8/AA/CA) — *not* the legacy F1/F0/F3 0x1FFFF7xx
# region.  Cal voltage = 3.0 V (datasheet), cal temps 30/130 °C.

# ---------------------------------------------------------------------------
# ADC
# ---------------------------------------------------------------------------

[adc]
# RM0440 §21.4.4 — G4 ADC max clock = 60 MHz (sync from HCLK/N
# or from PLL_P async).
max_clock_hz = 60_000_000

[adc.calibration_context]
# DS12288 §3.16.1 — TS_CAL1 = 30 °C, TS_CAL2 = 130 °C @ V_REF = 3.0 V.
peripheral = "ADC1"
vrefint_nominal_mv = 1212
cal_voltage_mv = 3000
cal_temp_low_celsius = 30
cal_temp_high_celsius = 130

[[adc.calibration_data_points]]
peripheral = "ADC1"
kind = "vrefint_cal"
address = 0x1FFF75AA
size_bits = 16
semantic_constant = 3000

[[adc.calibration_data_points]]
peripheral = "ADC1"
kind = "ts_cal_low"
address = 0x1FFF75A8
size_bits = 16
semantic_constant = 30

[[adc.calibration_data_points]]
peripheral = "ADC1"
kind = "ts_cal_high"
address = 0x1FFF75CA
size_bits = 16
semantic_constant = 130

# RM0440 §21.4.31 — G4 ADC1 internal channels (channels 16..18).
[[adc.internal_channels]]
peripheral = "ADC1"
kind = "vrefint"
channel_index = 18

[[adc.internal_channels]]
peripheral = "ADC1"
kind = "temperature_sensor"
channel_index = 16

[[adc.internal_channels]]
peripheral = "ADC1"
kind = "vbat"
channel_index = 17

# ---------------------------------------------------------------------------
# UART / I²C
# ---------------------------------------------------------------------------

[uart]
# RM0440 §38.4.7 — USART baud max at PCLK = 170 MHz oversample-8.
max_baud_hz = 21_000_000

[i2c]
# RM0440 §39 — Fast-Mode-Plus (1 MHz) supported.
max_clock_hz = 1_000_000

[[i2c.speed_options]]
name = "standard"
speed_hz = 100_000

[[i2c.speed_options]]
name = "fast"
speed_hz = 400_000

[[i2c.speed_options]]
name = "fast_plus"
speed_hz = 1_000_000

# ---------------------------------------------------------------------------
# Memory regions
# ---------------------------------------------------------------------------

[[memories]]
name = "FLASH"
kind = "flash"
base_address = 0x0800_0000
size_bytes = 524288   # 512 KB max on STM32G473/483 — overridable
access = "rx"
address_space = "code"

[[memories]]
name = "SRAM1"
kind = "sram"
base_address = 0x2000_0000
size_bytes = 81920    # 80 KB on STM32G473xE
access = "rwx"
address_space = "data"

# CCM SRAM — accessible via instruction/data buses, accelerated
# for math + lookup tables.  16 KB on STM32G473.
[[memories]]
name = "CCMSRAM"
kind = "sram"
base_address = 0x1000_0000
size_bytes = 16384
access = "rwx"
role = "ccm"

# SRAM2 — secondary RAM bank.
[[memories]]
name = "SRAM2"
kind = "sram"
base_address = 0x2001_8000
size_bytes = 16384
access = "rwx"
address_space = "data"

# ---------------------------------------------------------------------------
# System clock
# ---------------------------------------------------------------------------
# RM0440 §7.4.4 — G4 boots from HSI16 (16 MHz), max sysclk 170 MHz
# via PLL with R-output = 170 MHz (boost mode + flash latency 4).

[system_clock.post_reset_profile]
name = "default-hsi16-16mhz"
sysclk_hz = 16_000_000
hclk_hz = 16_000_000
pclk_hz = 16_000_000
source = "HSI16"

[[system_clock.recommended_profiles]]
name = "pll-hsi16-150mhz"
sysclk_hz = 150_000_000
hclk_hz = 150_000_000
pclk_hz = 150_000_000
source = "PLL_HSI16"
pll_m = 4    # 16 MHz / 4 = 4 MHz PLL input
pll_n = 75   # 4 MHz × 75 = 300 MHz VCO
pll_r = 2    # 300 / 2 = 150 MHz sysclk

[[system_clock.recommended_profiles]]
name = "pll-hsi16-170mhz-boost"
sysclk_hz = 170_000_000
hclk_hz = 170_000_000
pclk_hz = 170_000_000
source = "PLL_HSI16"
pll_m = 4
pll_n = 85   # 4 MHz × 85 = 340 MHz VCO
pll_r = 2    # 340 / 2 = 170 MHz sysclk (boost mode required)
