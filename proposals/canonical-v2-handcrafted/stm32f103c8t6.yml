# -----------------------------------------------------------------------------
# Golden config snippets — used by tests + as worked examples for codegen.
# Optional; codegen does NOT depend on them, but they pin known-good shapes.
# -----------------------------------------------------------------------------
system_examples:
  blink_pc13:
    description: "Blue-Pill on-board LED on PC13."
    clock: { sysclk: 72MHz, source: pll_main, pll_input: hse, pll_mul: 9, hse: 8MHz }
    gpio:  { instance: gpioc, pin: 13, mode: output-push-pull, speed: 2MHz }

  uart1_115200_pa9_pa10:
    clock: { sysclk: 72MHz, source: pll_main, pll_input: hse, pll_mul: 9, hse: 8MHz }
    pinmux:
      - { pin: PA9,  function: usart1_tx, mode: alternate-push-pull, speed: 50MHz }
      - { pin: PA10, function: usart1_rx, mode: input-floating }
    usart:
      instance: usart1
      baud: 115200
      data_bits: 8
      parity: none
      stop_bits: "1"
      mode: tx-rx
