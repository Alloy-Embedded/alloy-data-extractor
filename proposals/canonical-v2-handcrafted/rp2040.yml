# -----------------------------------------------------------------------------
# Golden config snippets.
# -----------------------------------------------------------------------------
system_examples:
  pico_blink_led:
    description: "Toggle the on-module LED on GPIO25."
    clock: { sys: 125MHz, source: pll_sys, xosc: 12MHz, vco: 1500MHz, post_divs: [6, 2] }
    gpio:  { instance: gpio, pin: 25, mode: output, function: sio }

  uart0_115200_gp0_gp1:
    clock: { sys: 125MHz, source: pll_sys, peri: 125MHz }
    pinmux:
      - { pin: GPIO0, function: uart0_tx }
      - { pin: GPIO1, function: uart0_rx }
    uart:
      instance: uart0
      baud: 115200
      data_bits: 8
      parity: none
      stop_bits: "1"
      mode: tx-rx
