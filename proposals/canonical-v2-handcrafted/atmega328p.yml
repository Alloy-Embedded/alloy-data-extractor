# =============================================================================
# ATmega328P  —  AVR 8-bit RISC, 32 KB flash, 2 KB SRAM, 1 KB EEPROM, DIP-28
# Found on every Arduino UNO ever made.  Runs at 16 MHz with ext. crystal.
# =============================================================================
# Hand-written reference under canonical-v2.  Flexes the schema enough to
# express Harvard-architecture quirks (separate program / data spaces),
# memory-mapped I/O register space, fuse bytes, and the lockbit / EEPROM
# tier — none of which fit cleanly in the ARM-centric v1 IR.

schema: alloy.device.v2.1

identity:
  vendor: microchip
  family: avr-mega
  device: atmega328p
  package: pdip28               # also TQFP-32 / VQFN-32; this is the UNO part
  core:
    isa: avr
    name: avr5                  # AVR architecture revision
    fpu: false
    mpu: false
    bits: 8
    endianness: little
    interrupt_lines: 26
    nvic_priority_bits: 0       # AVR: fixed priority by vector position

provenance:
  primary:    atmel-atdf:ATmega328P
  secondary:  [atmel-pack:Atmel.ATmega_DFP, doc-7810D-AVR]
  authored:   hand
  authored_on: 2026-05-01
  notes: >-
    AVR has separate Harvard program (flash) and data (SRAM + I/O register)
    address spaces.  Both start at 0x0000 in their own space; flash addresses
    are word-addressed in some contexts (LPM uses byte address × 2).  Codegen
    must emit the linker script with both regions.

# -----------------------------------------------------------------------------
# Memory map  —  Harvard architecture, two address spaces.
# -----------------------------------------------------------------------------
memory:
  # Program space (flash).  Word-addressed by the CPU; byte addresses in linker.
  - { id: flash,  base: 0x0000, size: 32KB, access: rx,  alias: code,
      address_space: program }

  # Data space.  Layout: 0x0000-0x001F = CPU registers (32× 8-bit GPR),
  # 0x0020-0x005F = standard I/O regs, 0x0060-0x00FF = extended I/O,
  # 0x0100-0x08FF = SRAM (2 KB).
  - { id: cpu_regs,  base: 0x0000, size: 32B,    access: rw,  alias: registers,
      address_space: data,    role: cpu-gpr }
  - { id: io_regs,   base: 0x0020, size: 64B,    access: rw,
      address_space: data,    role: io-low }
  - { id: ext_io,    base: 0x0060, size: 160B,   access: rw,
      address_space: data,    role: io-extended }
  - { id: sram,      base: 0x0100, size: 2KB,    access: rwx, alias: data,
      address_space: data }

  # Standalone non-volatile spaces.
  - { id: eeprom,    base: 0x0000, size: 1KB,    access: rw,
      address_space: eeprom }
  - { id: fuse,      base: 0x0000, size: 3B,     access: ro,
      address_space: fuse,    role: configuration-bits }
  - { id: lockbits,  base: 0x0000, size: 1B,     access: ro,
      address_space: fuse,    role: protection-bits }
  - { id: signature, base: 0x0000, size: 3B,     access: ro,
      address_space: signature }

# -----------------------------------------------------------------------------
# Clock tree.  Compared to STM32 this is trivial: a single CLKsys with
# selectable source + prescaler.  No PLL.
# -----------------------------------------------------------------------------
clock:
  oscillators:
    osc_int_8mhz:    { freq: 8MHz,        kind: rc-internal,      tolerance: 10% }
    osc_int_128khz:  { freq: 128kHz,      kind: rc-internal,      tolerance: 10% }
    osc_ext:         { freq: 16MHz,       kind: crystal-external, range: [0Hz, 20MHz] }
    # The Arduino UNO ships a 16 MHz crystal; bare ATmega328P with default
    # fuses runs from osc_int_8mhz with /8 prescaler ⇒ 1 MHz.

  domains:
    - id: clk_sys
      sources:    [osc_int_8mhz, osc_int_128khz, osc_ext]
      prescalers: [1, 2, 4, 8, 16, 32, 64, 128, 256]   # CLKPR.CLKPS
      max:        20MHz
      # Delta 12: AVR clock-source select is in fuse bits CKSEL[3:0]; the
      # prescaler is in CLKPR.CLKPS[3:0].  Codegen writes both at boot.
      select_register:
        reg: FUSE.LOW
        field: CKSEL
        encoding: { osc_ext: 0xF, osc_int_8mhz: 0x2, osc_int_128khz: 0x3 }
      prescaler_register:
        reg: CLKPR
        field: CLKPS
        encoding: { 1: 0, 2: 1, 4: 2, 8: 3, 16: 4, 32: 5, 64: 6, 128: 7, 256: 8 }
    - { id: clk_io,    source: clk_sys }     # peripherals
    - { id: clk_flash, source: clk_sys }
    - id: clk_adc
      source: clk_sys
      prescalers: [2, 4, 8, 16, 32, 64, 128]
      select_register: { reg: ADCSRA, field: ADPS,
                         encoding: { 2: 1, 4: 2, 8: 3, 16: 4, 32: 5, 64: 6, 128: 7 } }
    - { id: clk_async, sources: [osc_int_128khz], purpose: timer2-async }

  # Delta 10: named profiles.  AVR's "uno-default" is what the Arduino IDE
  # ships with; "factory-fuse" is what a virgin chip from Microchip runs at.
  profiles:
    - id: factory-fuse
      kind: post-reset
      sysclk: 1MHz
      sysclk_source: osc_int_8mhz
      prescaler: 8
      fuse_low: 0x62

    - id: uno-default-16mhz
      kind: recommended
      sysclk: 16MHz
      sysclk_source: osc_ext
      prescaler: 1
      fuse_low: 0xFF                          # external xtal, slow start

    - id: max-internal-8mhz
      kind: recommended
      sysclk: 8MHz
      sysclk_source: osc_int_8mhz
      prescaler: 1
      fuse_low: 0xE2                          # internal RC, no /8 div

  reset_state:
    sysclk_source:  osc_int_8mhz
    sysclk_freq:    1MHz                     # /8 prescaler from fuse default
    fuse_low_default: 0x62

# -----------------------------------------------------------------------------
# IP-block templates.  AVR registers are sparse (often a single 8-bit byte)
# and live in the I/O region — offsets here are absolute data-space addresses
# minus 0x20 (low) or 0x00 (extended).
# -----------------------------------------------------------------------------
templates:

  port:                                       # AVR GPIO "port" (PIN, DDR, PORT)
    pins_per_port: 8
    capabilities: [input, output, pull-up]    # no push/pull select on AVR
    registers:                                 # offsets are I/O register addrs
      pin:  { offset: 0x00, access: rw, role: input-state }
      ddr:  { offset: 0x01, role: data-direction }
      port: { offset: 0x02, role: output-state-and-pullup }

  usart:
    capabilities: [tx, rx, sync, async, multi-processor, 9-bit-frame]
    options:
      data_bits:    [5, 6, 7, 8, 9]
      parity:       [none, even, odd]
      stop_bits:    ["1", "2"]
      mode:         [async, sync-master, sync-slave, master-spi]
    max_baud: 2500000                         # at fosc=16 MHz, U2X=1
    registers:
      ucsra: { offset: 0xC0 }
      ucsrb: { offset: 0xC1 }
      ucsrc: { offset: 0xC2 }
      ubrrl: { offset: 0xC4 }
      ubrrh: { offset: 0xC5 }
      udr:   { offset: 0xC6 }
    # Opt-in subset (delta 13).  Full register catalogue lives in the ATDF
    # under provenance.primary; codegen reads ATDF for register-dump features.
    fields:
      ucsra.rxc:   { bit: 7 }
      ucsra.txc:   { bit: 6 }
      ucsra.udre:  { bit: 5 }
      ucsra.u2x:   { bit: 1 }
      ucsrb.rxen:  { bit: 4 }
      ucsrb.txen:  { bit: 3 }
      ucsrb.ucsz2: { bit: 2 }
      ucsrc.upm:   { bits: [4, 5],
                     enum: { none: 0, even: 2, odd: 3 } }       # delta 2
      ucsrc.usbs:  { bit: 3,
                     enum: { "1": 0, "2": 1 } }
      ucsrc.ucsz:  { bits: [1, 2],
                     enum: { "5bit": 0, "6bit": 1, "7bit": 2, "8bit": 3 } }

  spi:
    capabilities: [master, slave, msb-first, lsb-first]
    options:
      data_size:      [8]
      baud_prescaler: [4, 16, 64, 128]
      modes:          [0, 1, 2, 3]
    max_clock: 8MHz                           # fosc/2 max in master
    registers:
      spcr: { offset: 0x4C }
      spsr: { offset: 0x4D }
      spdr: { offset: 0x4E }
    fields:
      spcr.spie: { bit: 7 }
      spcr.spe:  { bit: 6 }
      spcr.dord: { bit: 5,
                   enum: { msb_first: 0, lsb_first: 1 } }      # delta 2
      spcr.mstr: { bit: 4,
                   enum: { slave: 0, master: 1 } }
      spcr.cpol: { bit: 3 }
      spcr.cpha: { bit: 2 }
      spcr.spr:  { bits: [0, 1],
                   enum: { div_4: 0, div_16: 1, div_64: 2, div_128: 3 } }
      spsr.spi2x: { bit: 0 }      # combined with spcr.spr → /2,/4,/8,/16,/32,/64
      spsr.spif:  { bit: 7 }

  twi:                                         # AVR's I²C peripheral
    capabilities: [master, slave, smbus]
    options:
      speeds: [100kHz, 400kHz]
    registers:
      twbr: { offset: 0xB8 }
      twsr: { offset: 0xB9 }
      twar: { offset: 0xBA }
      twdr: { offset: 0xBB }
      twcr: { offset: 0xBC }
      twamr: { offset: 0xBD }
    fields:
      twcr.twen:  { bit: 2 }
      twcr.twint: { bit: 7 }
      twcr.twsta: { bit: 5 }
      twcr.twsto: { bit: 4 }

  timer8:                                       # 8-bit timers (T0, T2)
    capabilities: [up, ctc, fast-pwm, phase-correct-pwm]
    counter_bits: 8
    channels: 2                                 # OCRnA / OCRnB
    # Delta 6: clock-source select (TCCRnB.CSn[2:0]).  Same encoding for T0
    # and T2; T2 adds external T2 oscillator option in the high values.
    trigger_sources:
      stopped:    0
      clk_io:     1
      clk_io_8:   2     # /8
      clk_io_64:  3
      clk_io_256: 4
      clk_io_1024: 5
      ext_t_falling: 6  # external pin Tn, falling edge
      ext_t_rising:  7
    # Delta 7: waveform generation mode (TCCRnA.WGM + TCCRnB.WGM combined).
    waveform_modes:
      normal:                  0
      pwm_phase_correct_8bit:  1
      ctc_ocra:                2
      fast_pwm_8bit:           3
      pwm_phase_correct_ocra:  5
      fast_pwm_ocra:           7
    registers:
      tccrna: { offset: 0x44 }      # placeholder — actual offsets per instance
      tccrnb: { offset: 0x45 }
      tcntn:  { offset: 0x46 }
      ocrna:  { offset: 0x47 }
      ocrnb:  { offset: 0x48 }

  timer16:                                      # 16-bit timer (T1)
    capabilities: [up, ctc, fast-pwm, phase-correct-pwm, input-capture]
    counter_bits: 16
    channels: 2
    registers:
      tccrna: { offset: 0x80 }
      tccrnb: { offset: 0x81 }
      tccrnc: { offset: 0x82 }
      tcntnh: { offset: 0x85 }
      tcntnl: { offset: 0x84 }
      ocrnah: { offset: 0x89 }
      ocrnal: { offset: 0x88 }
      ocrnbh: { offset: 0x8B }
      ocrnbl: { offset: 0x8A }
      icrnh:  { offset: 0x87 }
      icrnl:  { offset: 0x86 }

  adc:
    capabilities: [single, free-running, dma-via-irq]
    options:
      resolution: [10]
      reference:  [aref, avcc, internal-1.1v]
      sample_time_cycles: [13]                  # fixed; sample time = ADC clock / prescaler
    max_clock: 200kHz                            # for full 10-bit
    registers:
      adcl:   { offset: 0x78, access: ro }
      adch:   { offset: 0x79, access: ro }
      adcsra: { offset: 0x7A }
      adcsrb: { offset: 0x7B }
      admux:  { offset: 0x7C }

# -----------------------------------------------------------------------------
# Peripheral instances.  AVR's "single instance per IP" model means most
# templates have exactly one consumer — but the schema is the same as ARM.
# -----------------------------------------------------------------------------
peripherals:

  # --- GPIO ports (B, C, D — that's all the ATmega328P pins out)
  - { id: portb, template: port, base: 0x0023, bus: io-low,
      power_reduction: { reg: PRR, bit: null } }   # ports always on
  - { id: portc, template: port, base: 0x0026, bus: io-low }
  - { id: portd, template: port, base: 0x0029, bus: io-low }

  # --- USART (only one)
  - id: usart0
    template: usart
    base: 0x00C0                          # absolute data-space address
    bus:  ext-io
    clock_source: clk_io
    irq:  [{ num: 18, name: USART_RX_vect },
           { num: 19, name: USART_UDRE_vect },
           { num: 20, name: USART_TX_vect }]
    power_reduction: { reg: PRR, bit: 1 }   # PRUSART0
    pin_options:
      tx: [{ pin: PD1 }]
      rx: [{ pin: PD0 }]
      ck: [{ pin: PD4 }]                     # only in synchronous mode

  # --- SPI
  - id: spi0
    template: spi
    base: 0x004C                          # offset into I/O low region
    bus:  io-low
    clock_source: clk_io
    irq:  { num: 17, name: SPI_STC_vect }
    power_reduction: { reg: PRR, bit: 2 }    # PRSPI
    pin_options:
      sck:  [{ pin: PB5 }]                  # also Arduino UNO D13 / on-board LED
      miso: [{ pin: PB4 }]                  # Arduino UNO D12
      mosi: [{ pin: PB3 }]                  # Arduino UNO D11
      ss:   [{ pin: PB2 }]                  # Arduino UNO D10

  # --- TWI (I²C)
  - id: twi0
    template: twi
    base: 0x00B8
    bus:  ext-io
    clock_source: clk_io
    irq:  { num: 24, name: TWI_vect }
    power_reduction: { reg: PRR, bit: 7 }    # PRTWI
    pin_options:
      scl: [{ pin: PC5 }]                    # Arduino UNO A5
      sda: [{ pin: PC4 }]                    # Arduino UNO A4

  # --- Timers
  - id: timer0
    template: timer8
    base: 0x0044
    bus:  io-low
    clock_source: clk_io
    irq:  [{ num: 14, name: TIMER0_OVF_vect },
           { num: 16, name: TIMER0_COMPA_vect },
           { num: 15, name: TIMER0_COMPB_vect }]
    power_reduction: { reg: PRR, bit: 5 }    # PRTIM0
    pin_options:
      oc0a: [{ pin: PD6 }]                   # Arduino UNO D6
      oc0b: [{ pin: PD5 }]                   # Arduino UNO D5

  - id: timer1
    template: timer16
    base: 0x0080
    bus:  ext-io
    clock_source: clk_io
    irq:  [{ num:  9, name: TIMER1_CAPT_vect },
           { num: 10, name: TIMER1_COMPA_vect },
           { num: 11, name: TIMER1_COMPB_vect },
           { num: 12, name: TIMER1_OVF_vect }]
    power_reduction: { reg: PRR, bit: 3 }    # PRTIM1
    pin_options:
      oc1a: [{ pin: PB1 }]                   # Arduino UNO D9
      oc1b: [{ pin: PB2 }]                   # Arduino UNO D10
      icp:  [{ pin: PB0 }]                   # Arduino UNO D8

  - id: timer2
    template: timer8
    base: 0x00B0
    bus:  ext-io
    clock_source: clk_async                  # can run from external 32.768 kHz
    irq:  [{ num:  6, name: TIMER2_OVF_vect },
           { num:  7, name: TIMER2_COMPA_vect },
           { num:  8, name: TIMER2_COMPB_vect }]
    power_reduction: { reg: PRR, bit: 6 }    # PRTIM2
    pin_options:
      oc2a: [{ pin: PB3 }]                   # Arduino UNO D11
      oc2b: [{ pin: PD3 }]                   # Arduino UNO D3

  # --- ADC
  - id: adc0
    template: adc
    base: 0x0078
    bus:  ext-io
    clock_source: clk_adc
    irq:  { num: 21, name: ADC_vect }
    power_reduction: { reg: PRR, bit: 0 }    # PRADC
    channels:
      ch0: PC0     # Arduino UNO A0
      ch1: PC1     # A1
      ch2: PC2     # A2
      ch3: PC3     # A3
      ch4: PC4     # A4 (shared with TWI SDA)
      ch5: PC5     # A5 (shared with TWI SCL)
      ch6: ADC6    # TQFP-only
      ch7: ADC7    # TQFP-only
      ch8: temp_sensor
      ch14: bandgap_1v1
      ch15: gnd_0v

# -----------------------------------------------------------------------------
# Pin map — DIP-28 (the Arduino UNO part).  Arduino board labels in `arduino`.
# -----------------------------------------------------------------------------
pinout:
  - { pin:  1, signal: PC6,                                 arduino: RESET, constraints: [reset] }
  - { pin:  2, signal: PD0,                                 arduino: D0 }   # RX default
  - { pin:  3, signal: PD1,                                 arduino: D1 }   # TX default
  - { pin:  4, signal: PD2,                                 arduino: D2 }
  - { pin:  5, signal: PD3,                                 arduino: D3 }
  - { pin:  6, signal: PD4,                                 arduino: D4 }
  - { pin:  7, signal: VCC,                                 constraints: [power] }
  - { pin:  8, signal: GND,                                 constraints: [power] }
  - { pin:  9, signal: PB6,                                 arduino: XTAL1, default_function: osc-in,  constraints: [oscillator] }
  - { pin: 10, signal: PB7,                                 arduino: XTAL2, default_function: osc-out, constraints: [oscillator] }
  - { pin: 11, signal: PD5,                                 arduino: D5 }
  - { pin: 12, signal: PD6,                                 arduino: D6 }
  - { pin: 13, signal: PD7,                                 arduino: D7 }
  - { pin: 14, signal: PB0,                                 arduino: D8 }
  - { pin: 15, signal: PB1,                                 arduino: D9 }
  - { pin: 16, signal: PB2,                                 arduino: D10 }
  - { pin: 17, signal: PB3,                                 arduino: D11 }
  - { pin: 18, signal: PB4,                                 arduino: D12 }
  - { pin: 19, signal: PB5,                                 arduino: D13 }                          # on-board LED
  - { pin: 20, signal: AVCC,                                constraints: [power, analog] }
  - { pin: 21, signal: AREF,                                constraints: [analog] }
  - { pin: 22, signal: GND,                                 constraints: [power] }
  - { pin: 23, signal: PC0,                                 arduino: A0 }
  - { pin: 24, signal: PC1,                                 arduino: A1 }
  - { pin: 25, signal: PC2,                                 arduino: A2 }
  - { pin: 26, signal: PC3,                                 arduino: A3 }
  - { pin: 27, signal: PC4,                                 arduino: A4, default_function: i2c-sda } # SDA
  - { pin: 28, signal: PC5,                                 arduino: A5, default_function: i2c-scl } # SCL

# -----------------------------------------------------------------------------
# Vector table.  AVR has fixed-priority vectors — slot 0 is the reset vector.
# -----------------------------------------------------------------------------
interrupts:
  - { num:  0, name: __vector_default,    role: reset }
  - { num:  1, name: INT0_vect }
  - { num:  2, name: INT1_vect }
  - { num:  3, name: PCINT0_vect }
  - { num:  4, name: PCINT1_vect }
  - { num:  5, name: PCINT2_vect }
  - { num:  6, name: WDT_vect }
  - { num:  7, name: TIMER2_COMPA_vect }
  - { num:  8, name: TIMER2_COMPB_vect }
  - { num:  9, name: TIMER2_OVF_vect }
  - { num: 10, name: TIMER1_CAPT_vect }
  - { num: 11, name: TIMER1_COMPA_vect }
  - { num: 12, name: TIMER1_COMPB_vect }
  - { num: 13, name: TIMER1_OVF_vect }
  - { num: 14, name: TIMER0_COMPA_vect }
  - { num: 15, name: TIMER0_COMPB_vect }
  - { num: 16, name: TIMER0_OVF_vect }
  - { num: 17, name: SPI_STC_vect }
  - { num: 18, name: USART_RX_vect }
  - { num: 19, name: USART_UDRE_vect }
  - { num: 20, name: USART_TX_vect }
  - { num: 21, name: ADC_vect }
  - { num: 22, name: EE_READY_vect }
  - { num: 23, name: ANALOG_COMP_vect }
  - { num: 24, name: TWI_vect }
  - { num: 25, name: SPM_READY_vect }

# -----------------------------------------------------------------------------
# Fuses + lockbits — driven by `avrdude -U` recipes downstream.
# -----------------------------------------------------------------------------
fuses:
  low:
    default: 0x62
    fields:
      cksel:  { bits: [0, 3], description: clock-source-select }
      sut:    { bits: [4, 5], description: startup-time }
      ckout:  { bit: 6 }
      ckdiv8: { bit: 7 }
  high:
    default: 0xD9
    fields:
      bootrst:  { bit: 0 }
      bootsz:   { bits: [1, 2] }
      eesave:   { bit: 3 }
      wdton:    { bit: 4 }
      spien:    { bit: 5 }
      dwen:     { bit: 6 }
      rstdisbl: { bit: 7 }
  extended:
    default: 0xFF
    fields:
      bodlevel: { bits: [0, 2] }

# -----------------------------------------------------------------------------
# Golden config snippets.
# -----------------------------------------------------------------------------
system_examples:
  arduino_blink:
    description: "Toggle on-board LED (PB5 / Arduino D13) at 1 Hz."
    clock: { sysclk: 16MHz, source: osc_ext, prescaler: 1 }
    gpio:  { instance: portb, pin: 5, mode: output }

  uart_9600_default:
    clock: { sysclk: 16MHz, source: osc_ext, prescaler: 1 }
    pinmux:
      - { pin: PD0, function: usart0_rx }
      - { pin: PD1, function: usart0_tx }
    usart:
      instance: usart0
      baud: 9600
      data_bits: 8
      parity: none
      stop_bits: "1"
      mode: async
