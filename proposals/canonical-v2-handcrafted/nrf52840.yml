# =============================================================================
# nRF52840  —  ARM Cortex-M4F @ 64 MHz, 1 MB flash, 256 KB SRAM, aQFN-73
# Bluetooth 5, IEEE 802.15.4, USB 2.0 FS, Arm TrustZone-Cortex (no SAU).
# =============================================================================
# Hand-written reference under canonical-v2.  Models Nordic-specific
# weirdness:
#   • PSEL: every signal of every peripheral has a `PSEL.<sig>` register
#     that takes a free GPIO number — like ESP32's matrix but per-IP, with
#     a single 8-bit field instead of a global mux table.
#   • Peripheral instances share base addresses across "virtualized" IPs
#     (e.g. SPIM0 and TWIM0 share the same 0x40003000 — at most one of
#     each pair is enabled at a time).  Codegen has to honour the
#     mutual-exclusion group.
#   • UICR (User Information Configuration Registers) — non-volatile
#     bootstrap config, addressed like flash but written via NVMC.

schema: alloy.device.v2.1

identity:
  vendor: nordic
  family: nrf52
  device: nrf52840
  package: aqfn73
  core:
    isa:  armv7e-m
    name: cortex-m4
    fpu:  true                                 # single-precision
    mpu:  true
    bits: 32
    endianness: little
    interrupt_lines: 48
    nvic_priority_bits: 3                       # 8 levels (0..7)

provenance:
  primary:    nordic-svd:nrf52840
  secondary:  [nrf-mdk:8.55.0, nordic-zephyr-dts, nrf52840-ps]
  authored:   hand
  authored_on: 2026-05-01
  notes: >-
    Nordic exposes most peripherals as task/event registers (TASKS_START,
    EVENTS_RXDRDY, …) instead of bit-by-bit configuration.  The template's
    `tasks` and `events` lists capture that.

# -----------------------------------------------------------------------------
# Memory map.  Flash + RAM at conventional addresses; UICR is a separate
# 1 KB region the bootloader writes once at provisioning time.
# -----------------------------------------------------------------------------
memory:
  - { id: flash,    base: 0x00000000, size: 1MB,    access: rx,  alias: code }
  - { id: sram,     base: 0x20000000, size: 256KB,  access: rwx, alias: data }
  - { id: uicr,     base: 0x10001000, size: 1KB,    access: rw,
      role: configuration-bits }
  - { id: ficr,     base: 0x10000000, size: 1KB,    access: ro,
      role: factory-info-config }

# -----------------------------------------------------------------------------
# Clock tree.  Two clock domains: HFCLK (drives CPU + most peripherals) and
# LFCLK (RTC, watchdog, deep-sleep timer).
# -----------------------------------------------------------------------------
clock:
  oscillators:
    hfint:    { freq: 64MHz,        kind: rc-internal,      tolerance: 1% }
    hfxo:     { freq: 32MHz,        kind: crystal-external, range: [32MHz, 32MHz] }
    lfrc:     { freq: 32.768kHz,    kind: rc-internal,      tolerance: 250ppm }
    lfxtal:   { freq: 32.768kHz,    kind: crystal-external, optional: true }
    lfsynth:  { freq: 32.768kHz,    kind: synthesised,      source: hfclk }

  domains:
    - id: hfclk
      sources:    [hfint, hfxo]
      max:        64MHz
      notes: HFXO required when running radio.
      # Delta 12: HFCLK source comes up on reset as hfint; the radio's
      # CLOCK.TASKS_HFCLKSTART task switches to hfxo via the hardware
      # state machine — there's no register to write directly.  We model
      # this with `select_task` instead of `select_register`.
      select_task:
        on:  CLOCK.TASKS_HFCLKSTART
        off: CLOCK.TASKS_HFCLKSTOP
        status: CLOCK.HFCLKSTAT.SRC                  # 0=hfint, 1=hfxo
    - id: lfclk
      sources:    [lfrc, lfxtal, lfsynth]
      max:        32.768kHz
      select_register:
        reg: CLOCK.LFCLKSRC
        field: SRC
        encoding: { lfrc: 0, lfxtal: 1, lfsynth: 2 }
    - id: pclk
      source:     hfclk
      max:        64MHz

  # Delta 10: named profiles.  Nordic radio peripherals MUST run from HFXO,
  # so codegen offers a "radio-ready" profile that brings it up before BLE.
  profiles:
    - id: post-reset
      kind: post-reset
      sysclk: 64MHz
      sysclk_source: hfint
      lfclk_source: lfrc

    - id: radio-ready
      kind: recommended
      sysclk: 64MHz
      sysclk_source: hfxo
      lfclk_source: lfxtal
      notes: Required before any softdevice or 802.15.4 radio activity.

    - id: low-power-32k
      kind: low-power
      sysclk: 64MHz                           # HFCLK still 64 when active
      sysclk_source: hfint
      lfclk_source: lfrc
      notes: HFCLK auto-off in idle; LFCLK from RC for lowest standby cost.

  reset_state:
    hfclk_source: hfint
    hfclk_freq:   64MHz
    lfclk_source: lfrc

# -----------------------------------------------------------------------------
# IP-block templates.  Nordic IPs are uniformly task/event-driven — the
# template captures shared registers (`TASKS_*`, `EVENTS_*`, `INTEN`, `PSEL`).
# -----------------------------------------------------------------------------
templates:

  gpio:                                         # P0 / P1 ports (32-bit each)
    pins_per_port: 32
    capabilities: [input, output, push-pull, open-drain, pull-up, pull-down,
                   sense-high, sense-low, drive-strength-tuning, psel]
    drive_levels: [s0s1, h0s1, s0h1, h0h1, d0s1, d0h1, s0d1, h0d1]
    registers:
      out:        { offset: 0x504 }
      outset:     { offset: 0x508, access: wo }
      outclr:     { offset: 0x50C, access: wo }
      in:         { offset: 0x510, access: ro }
      dir:        { offset: 0x514 }
      dirset:     { offset: 0x518, access: wo }
      dirclr:     { offset: 0x51C, access: wo }
      pin_cnf:    { offset: 0x700, stride: 4, count: 32 }   # one per pin

  uarte:                                         # nRF52 UART with EasyDMA
    capabilities: [tx, rx, dma, hardware-flow-control, parity, psel]
    options:
      data_bits:    [8]
      parity:       [none, even]
      stop_bits:    ["1", "2"]
      flow_control: [none, rts-cts]
      # Delta 2: BAUDRATE register takes a literal 32-bit value, not a divider.
      # Codegen looks up `<rate> -> baudrate_value` from this enum.
      baudrate_encoding:
        1200:    0x0004F000
        2400:    0x0009D000
        4800:    0x0013B000
        9600:    0x00275000
        19200:   0x004EA000
        38400:   0x009D5000
        57600:   0x00EBF000
        115200: 0x01D7E000
        230400: 0x03AFB000
        460800: 0x075F7000
        921600: 0x10000000
        1000000: 0x10000000
    max_baud: 1000000
    registers:
      tasks_starttx:  { offset: 0x000, access: wo }
      tasks_stoptx:   { offset: 0x004, access: wo }
      tasks_startrx:  { offset: 0x008, access: wo }
      tasks_stoprx:   { offset: 0x00C, access: wo }
      events_cts:     { offset: 0x100 }
      events_rxdrdy:  { offset: 0x108 }
      events_endrx:   { offset: 0x110 }
      events_txdrdy:  { offset: 0x11C }
      events_endtx:   { offset: 0x120 }
      inten:          { offset: 0x300 }
      intenset:       { offset: 0x304 }
      intenclr:       { offset: 0x308 }
      enable:         { offset: 0x500 }
      psel_rts:       { offset: 0x508 }
      psel_txd:       { offset: 0x50C }
      psel_cts:       { offset: 0x510 }
      psel_rxd:       { offset: 0x514 }
      baudrate:       { offset: 0x524 }
      rxd_ptr:        { offset: 0x534 }
      rxd_maxcnt:     { offset: 0x538 }
      txd_ptr:        { offset: 0x544 }
      txd_maxcnt:     { offset: 0x548 }
      config:         { offset: 0x56C }

  spim:                                          # SPI master with EasyDMA
    capabilities: [master, full-duplex, dma, psel]
    options:
      data_size: [8]
      modes:     [0, 1, 2, 3]
      # Delta 2: nRF SPI FREQUENCY register is a 32-bit literal, not a
      # prescaler.  SPIM3 supports the additional 16/32 MHz values.
      frequency_encoding:
        125kHz:  0x02000000
        250kHz:  0x04000000
        500kHz:  0x08000000
        1MHz:    0x10000000
        2MHz:    0x20000000
        4MHz:    0x40000000
        8MHz:    0x80000000
        16MHz:   0x0A000000   # SPIM3 only
        32MHz:   0x14000000   # SPIM3 only
    registers:
      tasks_start: { offset: 0x010 }
      events_end:  { offset: 0x118 }
      enable:      { offset: 0x500 }
      psel_sck:    { offset: 0x508 }
      psel_mosi:   { offset: 0x50C }
      psel_miso:   { offset: 0x510 }
      psel_csn:    { offset: 0x514 }              # SPIM3 only: hardware CS
      frequency:   { offset: 0x524 }
      rxd_ptr:     { offset: 0x534 }
      rxd_maxcnt:  { offset: 0x538 }
      txd_ptr:     { offset: 0x544 }
      txd_maxcnt:  { offset: 0x548 }
      config:      { offset: 0x554 }

  twim:                                          # I²C master with EasyDMA
    capabilities: [master, dma, psel, smbus]
    options:
      speeds: [100kHz, 250kHz, 400kHz]
      # Delta 2: TWIM FREQUENCY register encoding.
      frequency_encoding:
        100kHz: 0x01980000
        250kHz: 0x04000000
        400kHz: 0x06400000
    registers:
      tasks_starttx: { offset: 0x008 }
      tasks_startrx: { offset: 0x000 }
      tasks_stop:    { offset: 0x014 }
      events_stopped: { offset: 0x104 }
      events_error:  { offset: 0x124 }
      enable:        { offset: 0x500 }
      psel_scl:      { offset: 0x508 }
      psel_sda:      { offset: 0x50C }
      frequency:     { offset: 0x524 }
      address:       { offset: 0x588 }

  timer:
    capabilities: [counter, timer, capture-compare, ppi]
    counter_bits_options: [8, 16, 24, 32]        # configurable via BITMODE
    channels: 6
    registers:
      tasks_start:   { offset: 0x000 }
      tasks_stop:    { offset: 0x004 }
      tasks_count:   { offset: 0x008 }
      tasks_clear:   { offset: 0x00C }
      events_compare: { offset: 0x140, stride: 4, count: 6 }
      shorts:        { offset: 0x200 }
      inten:         { offset: 0x300 }
      mode:          { offset: 0x504 }
      bitmode:       { offset: 0x508 }
      prescaler:     { offset: 0x510 }
      cc:            { offset: 0x540, stride: 4, count: 6 }

  saadc:                                          # 12-bit successive-approx ADC
    capabilities: [single, continuous, dma, calibration]
    options:
      resolution: [8, 10, 12, 14]
      reference:  [internal-0.6v, vdd-1div4]
      gain:       ["1/6", "1/5", "1/4", "1/3", "1/2", 1, 2, 4]
      acq_time_us: [3, 5, 10, 15, 20, 40]
      channels:    8
    max_clock: 5MHz

# -----------------------------------------------------------------------------
# Peripheral instances.  Note the mutex_group for shared base addresses.
# -----------------------------------------------------------------------------
peripherals:

  # --- GPIO ports
  - id: p0
    template: gpio
    base: 0x50000000
    bus:  apb
    rcc:  { en: null, rst: null }                # GPIO is always-on on nRF
    pin_count: 32

  - id: p1
    template: gpio
    base: 0x50000300                              # P1 is offset within GPIOTE region
    bus:  apb
    rcc:  { en: null, rst: null }
    pin_count: 16                                 # only P1.00..P1.15 bonded

  # --- UARTE (4 instances)
  - id: uarte0
    template: uarte
    base: 0x40002000
    bus:  apb
    clock_source: pclk
    irq:  { num:  2, name: UARTE0_UART0_IRQHandler }
    rcc:  { en: ENABLE.UARTE0 }                  # via the IP's own ENABLE reg
    mutex_group: uart0_spim0_twim0                # shares base with spim0/twim0
    pin_options:
      tx:  { psel: true }                         # any GPIO via PSEL.TXD
      rx:  { psel: true }
      cts: { psel: true }
      rts: { psel: true }

  - id: uarte1
    template: uarte
    base: 0x40028000
    bus:  apb
    clock_source: pclk
    irq:  { num: 40, name: UARTE1_IRQHandler }
    pin_options:
      tx:  { psel: true }
      rx:  { psel: true }
      cts: { psel: true }
      rts: { psel: true }

  # --- SPIM (4 instances; SPIM3 has higher max clock)
  - id: spim0
    template: spim
    base: 0x40003000
    bus:  apb
    clock_source: pclk
    irq:  { num:  3, name: SPIM0_SPIS0_TWIM0_TWIS0_SPI0_TWI0_IRQHandler }
    mutex_group: uart0_spim0_twim0
    pin_options: { sck: {psel: true}, mosi: {psel: true}, miso: {psel: true},
                   csn: {psel: true} }

  - id: spim1
    template: spim
    base: 0x40004000
    bus:  apb
    clock_source: pclk
    irq:  { num:  4, name: SPIM1_SPIS1_TWIM1_TWIS1_SPI1_TWI1_IRQHandler }
    mutex_group: spim1_twim1
    pin_options: { sck: {psel: true}, mosi: {psel: true}, miso: {psel: true},
                   csn: {psel: true} }

  - id: spim2
    template: spim
    base: 0x40023000
    bus:  apb
    clock_source: pclk
    irq:  { num: 35, name: SPIM2_SPIS2_SPI2_IRQHandler }
    pin_options: { sck: {psel: true}, mosi: {psel: true}, miso: {psel: true},
                   csn: {psel: true} }

  - id: spim3                                     # 32 MHz capable + hardware CS
    template: spim
    base: 0x4002F000
    bus:  apb
    clock_source: pclk
    irq:  { num: 47, name: SPIM3_IRQHandler }
    capabilities_extra: [hardware-cs, 32mhz]
    pin_options: { sck: {psel: true}, mosi: {psel: true}, miso: {psel: true},
                   csn: {psel: true} }

  # --- TWIM (I²C master)
  - id: twim0
    template: twim
    base: 0x40003000
    bus:  apb
    clock_source: pclk
    irq:  { num:  3, name: SPIM0_SPIS0_TWIM0_TWIS0_SPI0_TWI0_IRQHandler }
    mutex_group: uart0_spim0_twim0
    pin_options: { scl: {psel: true}, sda: {psel: true} }

  - id: twim1
    template: twim
    base: 0x40004000
    bus:  apb
    clock_source: pclk
    irq:  { num:  4, name: SPIM1_SPIS1_TWIM1_TWIS1_SPI1_TWI1_IRQHandler }
    mutex_group: spim1_twim1
    pin_options: { scl: {psel: true}, sda: {psel: true} }

  # --- Timers (5 instances; t0..t2 dedicated, t3..t4 dedicated 32-bit)
  - id: timer0
    template: timer
    base: 0x40008000
    bus:  apb
    clock_source: pclk
    irq:  { num:  8, name: TIMER0_IRQHandler }

  - id: timer1
    template: timer
    base: 0x40009000
    bus:  apb
    clock_source: pclk
    irq:  { num:  9, name: TIMER1_IRQHandler }

  - id: timer2
    template: timer
    base: 0x4000A000
    bus:  apb
    clock_source: pclk
    irq:  { num: 10, name: TIMER2_IRQHandler }

  - id: timer3
    template: timer
    base: 0x4001A000
    bus:  apb
    clock_source: pclk
    irq:  { num: 26, name: TIMER3_IRQHandler }
    counter_bits_default: 32

  - id: timer4
    template: timer
    base: 0x4001B000
    bus:  apb
    clock_source: pclk
    irq:  { num: 27, name: TIMER4_IRQHandler }
    counter_bits_default: 32

  # --- ADC
  - id: saadc
    template: saadc
    base: 0x40007000
    bus:  apb
    clock_source: pclk
    irq:  { num:  7, name: SAADC_IRQHandler }
    channels:
      ch0: { psel: AIN0, default_pin: P0_02 }
      ch1: { psel: AIN1, default_pin: P0_03 }
      ch2: { psel: AIN2, default_pin: P0_04 }
      ch3: { psel: AIN3, default_pin: P0_05 }
      ch4: { psel: AIN4, default_pin: P0_28 }
      ch5: { psel: AIN5, default_pin: P0_29 }
      ch6: { psel: AIN6, default_pin: P0_30 }
      ch7: { psel: AIN7, default_pin: P0_31 }

# -----------------------------------------------------------------------------
# Pin map  —  nRF52840 has port 0 (32 pins, P0_00..P0_31) and port 1
# (16 pins on aQFN73, P1_00..P1_15).  Most pins are full-function; a
# handful are reserved for crystal, SWD, NFC.
#
# constraints (delta 1):
#   * lfxo-bond     — reserved for low-frequency crystal (P0.00, P0.01)
#   * nfc-default   — sampled at boot for NFC (P0.09, P0.10); needs UICR
#                     opt-out before use as GPIO
#   * reset         — NRESET pin (P0.18 by UICR default)
#   * debug-default — SWDIO / SWDCLK
# -----------------------------------------------------------------------------
pinout:
  # P0 port — listing only the bonded pins on aQFN73, by silk-screen order.
  - { signal: P0_00,  rtc: lfxo,                                   constraints: [lfxo-bond] }
  - { signal: P0_01,  rtc: lfxo,                                   constraints: [lfxo-bond] }
  - { signal: P0_02,  saadc: ain0 }
  - { signal: P0_03,  saadc: ain1 }
  - { signal: P0_04,  saadc: ain2 }
  - { signal: P0_05,  saadc: ain3 }
  - { signal: P0_06 }
  - { signal: P0_07 }
  - { signal: P0_08 }
  - { signal: P0_09,                                               constraints: [nfc-default] }
  - { signal: P0_10,                                               constraints: [nfc-default] }
  - { signal: P0_11 }
  - { signal: P0_12 }
  - { signal: P0_13 }
  - { signal: P0_14 }
  - { signal: P0_15 }
  - { signal: P0_16 }
  - { signal: P0_17 }
  - { signal: P0_18,                                               constraints: [reset] }
  - { signal: P0_19 }
  - { signal: P0_20 }
  - { signal: P0_21 }
  - { signal: P0_22 }
  - { signal: P0_23 }
  - { signal: P0_24 }
  - { signal: P0_25 }
  - { signal: P0_26 }
  - { signal: P0_27 }
  - { signal: P0_28,  saadc: ain4 }
  - { signal: P0_29,  saadc: ain5 }
  - { signal: P0_30,  saadc: ain6 }
  - { signal: P0_31,  saadc: ain7 }
  # P1 port (16 of 32 bonded on aQFN73)
  - { signal: P1_00 }
  - { signal: P1_01 }
  - { signal: P1_02 }
  - { signal: P1_03 }
  - { signal: P1_04 }
  - { signal: P1_05 }
  - { signal: P1_06 }
  - { signal: P1_07 }
  - { signal: P1_08 }
  - { signal: P1_09 }
  - { signal: P1_10 }
  - { signal: P1_11 }
  - { signal: P1_12 }
  - { signal: P1_13 }
  - { signal: P1_14 }
  - { signal: P1_15 }
  # SWD + power pins
  - { signal: SWDIO,                                               constraints: [debug-default] }
  - { signal: SWDCLK,                                              constraints: [debug-default] }
  - { signal: VDD,                                                 constraints: [power] }
  - { signal: VDDH,                                                constraints: [power], voltage: hi-volt }
  - { signal: VSS,                                                 constraints: [power] }

# -----------------------------------------------------------------------------
# Vector table.  nRF52 NVIC has 48 IRQs; `mutex_group` peripherals share
# the same vector — see `peripherals` above.
# -----------------------------------------------------------------------------
interrupts:
  - { num:  0, name: POWER_CLOCK_IRQHandler }
  - { num:  1, name: RADIO_IRQHandler }
  - { num:  2, name: UARTE0_UART0_IRQHandler }
  - { num:  3, name: SPIM0_SPIS0_TWIM0_TWIS0_SPI0_TWI0_IRQHandler }
  - { num:  4, name: SPIM1_SPIS1_TWIM1_TWIS1_SPI1_TWI1_IRQHandler }
  - { num:  5, name: NFCT_IRQHandler }
  - { num:  6, name: GPIOTE_IRQHandler }
  - { num:  7, name: SAADC_IRQHandler }
  - { num:  8, name: TIMER0_IRQHandler }
  - { num:  9, name: TIMER1_IRQHandler }
  - { num: 10, name: TIMER2_IRQHandler }
  - { num: 11, name: RTC0_IRQHandler }
  - { num: 12, name: TEMP_IRQHandler }
  - { num: 13, name: RNG_IRQHandler }
  - { num: 14, name: ECB_IRQHandler }
  - { num: 15, name: CCM_AAR_IRQHandler }
  - { num: 16, name: WDT_IRQHandler }
  - { num: 17, name: RTC1_IRQHandler }
  - { num: 18, name: QDEC_IRQHandler }
  - { num: 19, name: COMP_LPCOMP_IRQHandler }
  - { num: 20, name: SWI0_EGU0_IRQHandler }
  - { num: 21, name: SWI1_EGU1_IRQHandler }
  - { num: 22, name: SWI2_EGU2_IRQHandler }
  - { num: 23, name: SWI3_EGU3_IRQHandler }
  - { num: 24, name: SWI4_EGU4_IRQHandler }
  - { num: 25, name: SWI5_EGU5_IRQHandler }
  - { num: 26, name: TIMER3_IRQHandler }
  - { num: 27, name: TIMER4_IRQHandler }
  - { num: 28, name: PWM0_IRQHandler }
  - { num: 29, name: PDM_IRQHandler }
  - { num: 32, name: MWU_IRQHandler }
  - { num: 33, name: PWM1_IRQHandler }
  - { num: 34, name: PWM2_IRQHandler }
  - { num: 35, name: SPIM2_SPIS2_SPI2_IRQHandler }
  - { num: 36, name: RTC2_IRQHandler }
  - { num: 37, name: I2S_IRQHandler }
  - { num: 38, name: FPU_IRQHandler }
  - { num: 39, name: USBD_IRQHandler }
  - { num: 40, name: UARTE1_IRQHandler }
  - { num: 41, name: QSPI_IRQHandler }
  - { num: 42, name: CRYPTOCELL_IRQHandler }
  - { num: 45, name: PWM3_IRQHandler }
  - { num: 47, name: SPIM3_IRQHandler }

# -----------------------------------------------------------------------------
# Golden config snippets.
# -----------------------------------------------------------------------------
system_examples:
  blink_p0_13:
    description: "nRF52840 DK on-board LED1 on P0.13."
    clock: { hfclk: 64MHz, source: hfint, lfclk: lfrc }
    gpio:  { instance: p0, pin: 13, mode: output-push-pull }

  uarte0_115200:
    clock: { hfclk: 64MHz, source: hfint }
    pinmux:
      - { pin: P0_06, function: uarte0_tx }
      - { pin: P0_08, function: uarte0_rx }
    uarte:
      instance: uarte0
      baud: 115200
      data_bits: 8
      parity: none
      stop_bits: "1"
      flow_control: none
